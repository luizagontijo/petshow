springdoc:
  api-docs:
    path: /v1/api-docs

  swagger-ui:
    path: /docs
    operations-sorter: alpha        # ordena alfabeticamente
    tags-sorter: alpha
    doc-expansion: none             # tudo recolhido por padrão
    try-it-out-enabled: true
    filter: true                   # caixa de filtro no topo
    deep-linking: true
    display-request-duration: true
    persist-authorization: true     # mantém o token entre reloads

server:
# port: 8080